# Keeps the free Supabase project (留言板) awake: it pauses after ~7 days with no traffic.
# Runs every 3 days and reads one row with the public (publishable) key — the same key the website already uses.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one note
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gbwoznjcujkafuzbkqhl.supabase.co/rest/v1/notes?select=id&limit=1" \
            -H "apikey: sb_publishable_Qfpe4W_udlA_030K78jxpA_MkCcY12u" \
            -H "Authorization: Bearer sb_publishable_Qfpe4W_udlA_030K78jxpA_MkCcY12u")
          echo "Supabase responded $code"
          test "$code" = "200"
